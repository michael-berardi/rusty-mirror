[package]
name = "rusty-mirror"
description = "A hidden, disposable, effect-denied twin of your real Tauri app window, driven by agents over a local socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["tauri", "debugging", "qa", "webview", "agents"]
categories = ["development-tools::debugging", "gui"]

[dependencies]
rusty-mirror-core.workspace = true
serde_json.workspace = true
base64.workspace = true
libc.workspace = true
tauri = { version = "2.5", default-features = false, features = ["wry"] }
uuid = { version = "1", features = ["v4"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tally</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <p class="label">Things counted</p>
      <output id="count">0</output>
      <div class="actions">
        <button id="plus" type="button">Count one more</button>
        <button id="save" type="button" class="quiet">Save to disk</button>
      </div>
      <p id="status" role="status">Nothing saved yet.</p>
      <footer>Build <span id="build"></span></footer>
    </main>
  </body>
</html>

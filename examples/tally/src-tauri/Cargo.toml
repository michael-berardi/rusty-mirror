[package]
name = "tally"
description = "The smallest honest Rusty Mirror integration: a counter with one read and one effect."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Private QA builds only. Consumer builds leave this off and contain no mirror.
mirror-debug = ["dep:rusty-mirror"]

[dependencies]
tauri = { version = "2.5", features = [] }
serde_json = "1"
rusty-mirror = { path = "../../../crates/rusty-mirror", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
